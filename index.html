<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parabéns, Ubatuba!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0066a1 0%, #00a86b 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      color: #fff;
    }
    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    p.sub { font-size: 1rem; opacity: 0.9; max-width: 480px; }

    .card {
      background: #fff;
      color: #222;
      border-radius: 16px;
      padding: 24px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .dropzone {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      border: 3px dashed #00a86b;
      border-radius: 12px;
      padding: 36px 16px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
      background: #f4fffa;
      min-height: 160px;
      line-height: 1.4;
    }
    .dropzone:hover, .dropzone.dragover { background: #e0fff2; }
    .dropzone > * { margin: 0; }
    .dropzone input { display: none !important; }
    .dropzone .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 8px;
      line-height: 1;
    }
    .dropzone strong {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      color: #222;
    }
    .dropzone .hint {
      display: block;
      margin-top: 8px;
      font-size: 0.85rem;
      color: #666;
      font-weight: 400;
    }

    .format-selector {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .format-option {
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      transition: all 0.2s;
      user-select: none;
    }
    .format-option:hover { border-color: #00a86b; background: #f4fffa; }
    .format-option.active {
      border-color: #00a86b;
      background: #e0fff2;
      box-shadow: 0 0 0 3px rgba(0,168,107,0.2);
    }
    .format-option .shape {
      display: block; margin: 0 auto 8px;
      background: #00a86b; border-radius: 4px;
    }
    .format-option .shape.feed { width: 32px; height: 32px; }
    .format-option .shape.stories { width: 20px; height: 34px; }
    .format-option .label { font-weight: 600; font-size: 0.95rem; display: block; }
    .format-option .desc { font-size: 0.75rem; color: #666; display: block; margin-top: 2px; }

    .crop-control {
      margin-top: 18px;
      padding: 14px;
      background: #f4fffa;
      border: 2px solid #b2e6cf;
      border-radius: 12px;
    }
    .crop-control label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #0066a1;
    }
    .crop-control input[type="range"] {
      width: 100%;
      accent-color: #00a86b;
      cursor: pointer;
    }
    .crop-control .crop-hint {
      display: block;
      font-size: 0.75rem;
      color: #666;
      margin-top: 6px;
      text-align: center;
    }

    .btn {
      display: block; width: 100%; padding: 14px; margin-top: 16px;
      border: none; border-radius: 10px;
      background: #00a86b; color: #fff;
      font-size: 1.05rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: #008a58; }
    .btn:disabled { background: #bbb; cursor: not-allowed; }
    .btn.secondary { background: #0066a1; }
    .btn.secondary:hover { background: #005080; }

    canvas { display: none; }
    #preview { margin-top: 20px; text-align: center; }
    #preview img {
      max-width: 100%; max-height: 400px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
    .hint { font-size: 0.85rem; color: #666; margin-top: 12px; text-align: center; }
    footer { margin-top: 32px; font-size: 0.85rem; opacity: 0.8; text-align: center; }
    .loading { text-align: center; margin-top: 16px; font-weight: 600; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>Parabéns, Ubatuba!</h1>
    <p class="sub">Compartilhe o carinho pela nossa cidade.</p>
  </header>

  <div class="card">

    <label class="dropzone" id="dropzone">
      <span class="icon">📷</span>
      <strong>Clique ou arraste sua foto aqui</strong>
      <span class="hint">JPG, PNG — qualquer formato</span>
      <input type="file" id="fileInput" accept="image/*" />
    </label>

    <div class="format-selector" id="formatSelector">
      <div class="format-option active" data-format="feed">
        <span class="shape feed"></span>
        <span class="label">Feed</span>
        <span class="desc">1:1 • 1080×1080</span>
      </div>
      <div class="format-option" data-format="stories">
        <span class="shape stories"></span>
        <span class="label">Stories</span>
        <span class="desc">9:16 • 1080×1920</span>
      </div>
    </div>

    <div class="crop-control hidden" id="cropControl">
      <label for="cropSlider" id="cropLabel">Ajustar enquadramento</label>
      <input type="range" id="cropSlider" min="0" max="100" value="50" />
      <span class="crop-hint" id="cropHint"></span>
    </div>

    <button class="btn" id="generateBtn" disabled>Gerar imagem com a arte 🎨</button>

    <div class="loading hidden" id="loading">Processando… ⏳</div>

    <div id="preview" class="hidden">
      <img id="resultImg" alt="Sua foto com a arte de parabéns" />
      <button class="btn secondary" id="downloadBtn">⬇️ Baixar imagem</button>
      <p class="hint">Pronto! Agora é só postar nas suas redes sociais. 💙💚</p>
    </div>
  </div>

  <footer>Desenvolvido por Fabrício Ramos</footer>

  <!-- Canvas de preview (oculto) -->
  <canvas id="previewCanvas"></canvas>
  <!-- Canvas final em alta resolução (oculto) -->
  <canvas id="finalCanvas"></canvas>

0C2glppBOybtRvSc43hni3Ec471nWVRUQFl7Qmt4zQtaxqK1ZlHkTB+euHtecDG95mo+w9cVYRxhAoVzmjz3iAdf5ijf8IQvPcqCNgZWNRpBEDAcJChjmeyOORqOOOgnWAOzlyWX9zNOb255LDPSOKLOaqRlCY2iVStybUi7HXrWsp8mTIYD+kGIVkI/iuiFATVCoNeJqSYiLOJ/LS6pb5Jwn00jXy+i/tQZ928tU+rvHV3v5tHf6eKDV6gAAAAASUVORK5CYII=";

    /* Alternativa: se preferir carregar de um arquivo local (mesmo domínio),
       defina OVERLAY_URL com o caminho e deixe OVERLAY_DATA_URL vazio. */
    const OVERLAY_URL = "";

    // ---------------------------------------------------------------------
    //  Referências de DOM
    // ---------------------------------------------------------------------
    const fileInput     = document.getElementById('fileInput');
    const dropzone      = document.getElementById('dropzone');
    const formatOptions = document.querySelectorAll('.format-option');
    const generateBtn   = document.getElementById('generateBtn');
    const downloadBtn   = document.getElementById('downloadBtn');
    const preview       = document.getElementById('preview');
    const resultImg     = document.getElementById('resultImg');
    const loading       = document.getElementById('loading');
    const previewCanvas = document.getElementById('previewCanvas');
    const finalCanvas   = document.getElementById('finalCanvas');
    const cropControl   = document.getElementById('cropControl');
    const cropSlider    = document.getElementById('cropSlider');
    const cropLabel     = document.getElementById('cropLabel');
    const cropHint      = document.getElementById('cropHint');

    // ---------------------------------------------------------------------
    //  Estado
    // ---------------------------------------------------------------------
    let userFile = null;
    let userImgCache = null;
    let overlayImgCache = null;
    let currentFormat = 'feed';
    let cropAxis = null;
    let previewDebounce = null;
    let isRendering = false;          // lock global de renderização
    let previewObjectURL = null;      // rastreia URL de preview para revogar

    // ---------------------------------------------------------------------
    //  Seleção de arquivo
    // ---------------------------------------------------------------------
    fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

    ['dragover','dragenter'].forEach(ev =>
      dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('dragover'); })
    );
    ['dragleave','drop'].forEach(ev =>
      dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('dragover'); })
    );
    dropzone.addEventListener('drop', e => {
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) handleFile(f);
    });

    async function handleFile(file) {
      if (!file) return;
      try {
        userFile = file;
        userImgCache = await loadUserImage(file);
        cropSlider.value = 50;
        updateCropControl();
        generateBtn.disabled = false;
        preview.classList.add('hidden');
        loading.classList.add('hidden');
        await refreshPreview();
      } catch (err) {
        console.error(err);
        alert('Não foi possível carregar a imagem. Tente outra foto.');
      }
    }

    // ---------------------------------------------------------------------
    //  Troca de formato
    // ---------------------------------------------------------------------
    formatOptions.forEach(opt => {
      opt.addEventListener('click', async () => {
        clearTimeout(previewDebounce);
        formatOptions.forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        currentFormat = opt.dataset.format;
        cropSlider.value = 50;
        updateCropControl();
        preview.classList.add('hidden');
        if (userFile) {
          generateBtn.disabled = false;
          await refreshPreview();
        }
      });
    });

    // ---------------------------------------------------------------------
    //  Controle de enquadramento
    // ---------------------------------------------------------------------
    function updateCropControl() {
      if (!userImgCache) {
        cropControl.classList.add('hidden');
        cropAxis = null;
        return;
      }

      const [OUT_W, OUT_H] = currentFormat === 'feed' ? [1080, 1080] : [1080, 1920];
      const targetRatio = OUT_W / OUT_H;
      const imgRatio    = userImgCache.naturalWidth / userImgCache.naturalHeight;

      if (Math.abs(imgRatio - targetRatio) / targetRatio < 0.005) {
        cropControl.classList.add('hidden');
        cropAxis = null;
        return;
      }

      cropControl.classList.remove('hidden');
      cropAxis = imgRatio > targetRatio ? 'x' : 'y';

      if (cropAxis === 'y') {
        cropLabel.textContent = 'Ajustar enquadramento (vertical)';
        cropHint.textContent  = 'Arraste para escolher onde a foto será cortada (a prévia atualiza ao vivo).';
      } else {
        cropLabel.textContent = 'Ajustar enquadramento (horizontal)';
        cropHint.textContent  = 'Arraste para escolher onde a foto será cortada (a prévia atualiza ao vivo).';
      }
    }

    // ---------------------------------------------------------------------
    //  Carregamento de imagens
    // ---------------------------------------------------------------------
    function loadImage(src, cors = false) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        if (cors) img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('Falha ao carregar: ' + src.slice(0, 80) + '...'));
        img.src = src;
      });
    }

    function loadUserImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => loadImage(e.target.result).then(resolve).catch(reject);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ---------------------------------------------------------------------
    //  Overlay (base64 inline, mesmo domínio ou CORS)
    // ---------------------------------------------------------------------
    async function ensureOverlay() {
      if (overlayImgCache) return overlayImgCache;

      let src, useCors;
      if (OVERLAY_DATA_URL && OVERLAY_DATA_URL.startsWith('data:')) {
        src = OVERLAY_DATA_URL;
        useCors = false; // data URI não precisa CORS
      } else if (OVERLAY_URL) {
        src = OVERLAY_URL;
        useCors = true;
      } else {
        throw new Error(
          'A arte não foi configurada. Edite OVERLAY_DATA_URL (ou OVERLAY_URL) no topo do <script>.'
        );
      }

      const img = await loadImage(src, useCors);
      overlayImgCache = img;

      // Testa se o canvas não fica "tainted" (só quando cross-origin).
      if (useCors) {
        try {
          const testCanvas = document.createElement('canvas');
          testCanvas.width = testCanvas.height = 1;
          testCanvas.getContext('2d').drawImage(img, 0, 0, 1, 1);
          testCanvas.toDataURL();
        } catch (e) {
          overlayImgCache = null;
          throw new Error(
            'A arte não permite uso em canvas (CORS). ' +
            'Hospede-a no mesmo domínio ou use base64 (OVERLAY_DATA_URL).'
          );
        }
      }

      return overlayImgCache;
    }

    // ---------------------------------------------------------------------
    //  Composição (desenha no canvas informado)
    // ---------------------------------------------------------------------
    function renderComposition(canvasEl, mode) {
      const c = canvasEl.getContext('2d');
      const isFeed = currentFormat === 'feed';

      let OUT_W, OUT_H;
      if (mode === 'preview') {
        OUT_W = 540;
        OUT_H = isFeed ? 540 : 960;
      } else {
        OUT_W = 1080;
        OUT_H = isFeed ? 1080 : 1920;
      }

      canvasEl.width  = OUT_W;
      canvasEl.height = OUT_H;
      c.clearRect(0, 0, OUT_W, OUT_H);

      const cropOffset = parseInt(cropSlider.value, 10) / 100;
      drawCoverWithOffset(c, userImgCache, 0, 0, OUT_W, OUT_H, cropAxis, cropOffset);
      drawOverlay(c, overlayImgCache, OUT_W, OUT_H);
    }

    // ---------------------------------------------------------------------
    //  toBlob com Promise + tratamento de null (canvas tainted)
    // ---------------------------------------------------------------------
    function canvasToBlob(canvasEl, type, quality) {
      return new Promise((resolve, reject) => {
        try {
          canvasEl.toBlob(blob => {
            if (!blob) {
              reject(new Error(
                'A geração da imagem falhou (canvas "tainted" ou memória insuficiente). ' +
                'Verifique se a arte carregou corretamente.'
              ));
              return;
            }
            resolve(blob);
          }, type, quality);
        } catch (err) {
          reject(err);
        }
      });
    }

    // ---------------------------------------------------------------------
    //  Preview (debounced) usando canvas separado
    // ---------------------------------------------------------------------
    async function refreshPreview() {
      if (!userImgCache) return;
      if (isRendering) return; // evita concorrência com geração/download

      try {
        await ensureOverlay();
        renderComposition(previewCanvas, 'preview');
        const blob = await canvasToBlob(previewCanvas, 'image/jpeg', 0.85);

        // Revoga URL anterior
        if (previewObjectURL) URL.revokeObjectURL(previewObjectURL);
        previewObjectURL = URL.createObjectURL(blob);
        resultImg.src = previewObjectURL;
        preview.classList.remove('hidden');
      } catch (err) {
        console.error('Preview falhou:', err);
        // Não mostra alert no preview para não incomodar; só loga.
      }
    }

    cropSlider.addEventListener('input', () => {
      clearTimeout(previewDebounce);
      previewDebounce = setTimeout(refreshPreview, 40);
    });

    // ---------------------------------------------------------------------
    //  Gerar (alta resolução) — usa finalCanvas + lock
    // ---------------------------------------------------------------------
    generateBtn.addEventListener('click', async () => {
      if (!userFile || !userImgCache) return;

      // Cancela qualquer preview pendente para não competir
      clearTimeout(previewDebounce);

      if (isRendering) return;
      isRendering = true;
      generateBtn.disabled = true;
      loading.classList.remove('hidden');
      preview.classList.add('hidden');

      try {
        await ensureOverlay();

        // Pequeno delay para o navegador respirar antes do trabalho pesado
        await new Promise(r => setTimeout(r, 20));

        renderComposition(finalCanvas, 'final');
        const blob = await canvasToBlob(finalCanvas, 'image/jpeg', 0.92);

        if (previewObjectURL) URL.revokeObjectURL(previewObjectURL);
        previewObjectURL = URL.createObjectURL(blob);
        resultImg.src = previewObjectURL;

        preview.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        alert(err.message || 'Não foi possível gerar a imagem. Tente novamente.');
      } finally {
        loading.classList.add('hidden');
        generateBtn.disabled = false;
        isRendering = false;
      }
    });

    // ---------------------------------------------------------------------
    //  Download — usa finalCanvas + lock
    // ---------------------------------------------------------------------
    downloadBtn.addEventListener('click', async () => {
      if (!userImgCache) return;

      if (isRendering) return;
      isRendering = true;

      const originalText = downloadBtn.textContent;
      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Preparando download… ⏳';

      try {
        await ensureOverlay();
        await new Promise(r => setTimeout(r, 20));

        renderComposition(finalCanvas, 'final');
        const blob = await canvasToBlob(finalCanvas, 'image/jpeg', 0.92);

        const a = document.createElement('a');
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = currentFormat === 'feed'
          ? 'parabens-ubatuba-feed.jpg'
          : 'parabens-ubatuba-stories.jpg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      } catch (err) {
        console.error(err);
        alert(err.message || 'Não foi possível gerar a imagem final. Tente novamente.');
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.textContent = originalText;
        isRendering = false;
      }
    });

    // ---------------------------------------------------------------------
    //  Helpers de desenho
    // ---------------------------------------------------------------------
    function drawCoverWithOffset(context, img, dx, dy, dw, dh, axis, t) {
      const iw = img.naturalWidth;
      const ih = img.naturalHeight;
      const targetRatio = dw / dh;
      const imgRatio    = iw / ih;

      let sx, sy, sw, sh;
      if (imgRatio > targetRatio) {
        sh = ih;
        sw = ih * targetRatio;
        sy = 0;
        const extra = iw - sw;
        sx = axis === 'x' ? extra * t : extra / 2;
      } else {
        sw = iw;
        sh = iw / targetRatio;
        sx = 0;
        const extra = ih - sh;
        sy = axis === 'y' ? extra * t : extra / 2;
      }
      context.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
    }

    function drawOverlay(context, img, OUT_W, OUT_H) {
      const iw = img.naturalWidth;
      const ih = img.naturalHeight;

      if (currentFormat === 'feed') {
        const scaleCover = Math.max(OUT_W / iw, OUT_H / ih);
        const w = iw * scaleCover;
        const h = ih * scaleCover;
        const x = (OUT_W - w) / 2;
        const y = (OUT_H - h) / 2;
        context.drawImage(img, x, y, w, h);
        return;
      }

      const scale = Math.min(OUT_W / iw, OUT_H / ih);
      const w = iw * scale;
      const h = ih * scale;
      const x = (OUT_W - w) / 2;
      const y = OUT_H - h;
      context.drawImage(img, x, y, w, h);
    }
  </script>
